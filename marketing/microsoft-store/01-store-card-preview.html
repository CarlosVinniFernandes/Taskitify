<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store Card Preview</title>
<style>
  :root { --bg:#202020; --card:#2b2b2b; --border:#363636; --ink:#ffffff; --muted:#c5c5c5; --chip:#3a3a3a; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; display:flex; gap:48px;
         align-items:flex-start; justify-content:center; padding:48px 16px; flex-wrap:wrap; box-sizing:border-box; }
  .card { width:340px; background:var(--card); border:1px solid var(--border); border-radius:8px; padding:16px; box-sizing:border-box; }
  .head { display:flex; gap:12px; align-items:flex-start; }
  .icon { width:56px; height:56px; border-radius:6px; background:#06130F; display:grid; place-items:center; flex:none; }
  .icon img { width:48px; height:48px; }
  .name { font-size:18px; font-weight:600; line-height:1.2; }
  .meta { font-size:13px; color:var(--muted); margin-top:4px; }
  .get { margin-left:auto; background:var(--chip); border-radius:4px; padding:5px 12px; font-size:13px; }
  .desc { font-size:13px; color:var(--muted); margin:14px 0 12px; }
  .shot { width:308px; height:173px; border-radius:4px; display:block; image-rendering:auto; }
  figure { margin:0; }
  figcaption { font-size:12px; color:#9a9a9a; margin-top:10px; text-align:center; }
  .large { width:min(960px,100%); }
  .large img { width:100%; border-radius:6px; display:block; }
</style>
</head>
<body>
  <figure>
    <div class="card">
      <div class="head">
        <div class="icon"><img src="../../docs/images/logo.png" alt="Taskitify logo"></div>
        <div>
          <div class="name">Taskitify</div>
          <div class="meta">Apps · Music</div>
        </div>
        <div class="get">Get</div>
      </div>
      <div class="desc">Synced lyrics and music controls on your taskbar.</div>
      <img class="shot" src="01-main-thumbnail.png" alt="Taskitify main screenshot thumbnail">
    </div>
    <figcaption>Discovery card, thumbnail at actual size (308 × 173)</figcaption>
  </figure>
  <figure class="large">
    <img src="01-main-screenshot.png" alt="Taskitify main screenshot">
    <figcaption>01-main-screenshot.png (3840 × 2160, scaled to fit)</figcaption>
  </figure>
</body>
</html>
